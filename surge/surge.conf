# Surge Mac 6.9+ / Surge iOS 5.22+
# Shared Mac/iOS template. Import the Sub-Store-generated complete profile.

[General]
loglevel = notify
ipv6 = false
dns-server = system, 223.5.5.5, 119.29.29.29
# Only explicit IP mappings in [Host] are forced for proxied requests. This
# prevents polluted DNS answers for critical endpoints without changing the
# existing domestic and corporate DNS behavior.
use-local-host-item-for-proxy = true
proxy-test-url = http://www.gstatic.com/generate_204
internet-test-url = http://connectivitycheck.platform.hicloud.com/generate_204
test-timeout = 5

[Host]
# Telegram Bot API DNS is polluted on mainland resolvers. Both addresses were
# verified against Telegram TLS before inclusion; multiple addresses retain
# endpoint failover while the domain/SNI remains api.telegram.org.
api.telegram.org = 149.154.166.110,149.154.167.220

# Corporate split DNS. The exact domain and wildcard are both required.
szridge.com = server:10.0.0.1,10.0.0.200
e.szridge.com = server:10.0.0.1,10.0.0.200
*.szridge.com = server:10.0.0.1,10.0.0.200

# Historical domestic CDN DNS fixes.
xiaohongshu.com = server:223.5.5.5,119.29.29.29
*.xiaohongshu.com = server:223.5.5.5,119.29.29.29
xhscdn.com = server:223.5.5.5,119.29.29.29
*.xhscdn.com = server:223.5.5.5,119.29.29.29
xhslink.com = server:223.5.5.5,119.29.29.29
*.xhslink.com = server:223.5.5.5,119.29.29.29

[Proxy]
# Sub-Store injects the private Surge proxy list here.

[Proxy Group]
# US is reliability-first: ordered fallback, shorter health interval, and an
# initial availability evaluation. c87s1/2/3 retain their historical mapping.
US-AUTO = fallback, include-all-proxies=true, policy-regex-filter="(?i)(\bUS\b|USA|United\s*States|美国|美國|🇺🇸|洛杉矶|洛杉磯|圣何塞|聖何塞|西雅图|西雅圖|达拉斯|達拉斯|纽约|紐約|Los\s*Angeles|San\s*Jose|Seattle|Dallas|New\s*York|c87s[123]\b|US\d+)", interval=300, timeout=5, evaluate-before-use=true
US-MANUAL = select, include-all-proxies=true, policy-regex-filter="(?i)(\bUS\b|USA|United\s*States|美国|美國|🇺🇸|洛杉矶|洛杉磯|圣何塞|聖何塞|西雅图|西雅圖|达拉斯|達拉斯|纽约|紐約|Los\s*Angeles|San\s*Jose|Seattle|Dallas|New\s*York|c87s[123]\b|US\d+)"
US = select, US-AUTO, US-MANUAL

HK-AUTO = url-test, include-all-proxies=true, policy-regex-filter="(?i)(\bHK\b|Hong\s*Kong|香港|🇭🇰|HKBN|HK\d+)", interval=600, tolerance=100
HK-MANUAL = select, include-all-proxies=true, policy-regex-filter="(?i)(\bHK\b|Hong\s*Kong|香港|🇭🇰|HKBN|HK\d+)"
HK = select, HK-AUTO, HK-MANUAL

# c87s4 retains its historical JP mapping.
JP-AUTO = url-test, include-all-proxies=true, policy-regex-filter="(?i)(\bJP\b|Japan|日本|🇯🇵|东京|東京|大阪|埼玉|樱花|櫻花|biglobe|c87s4\b|JP\d+)", interval=600, tolerance=100
JP-MANUAL = select, include-all-proxies=true, policy-regex-filter="(?i)(\bJP\b|Japan|日本|🇯🇵|东京|東京|大阪|埼玉|樱花|櫻花|biglobe|c87s4\b|JP\d+)"
JP = select, JP-AUTO, JP-MANUAL

SG-AUTO = url-test, include-all-proxies=true, policy-regex-filter="(?i)(\bSG\b|Singapore|新加坡|狮城|獅城|🇸🇬|SG\d+)", interval=600, tolerance=100
SG-MANUAL = select, include-all-proxies=true, policy-regex-filter="(?i)(\bSG\b|Singapore|新加坡|狮城|獅城|🇸🇬|SG\d+)"
SG = select, SG-AUTO, SG-MANUAL

# OpenAI region is chosen manually; each region handles node failure internally.
AI-REGION = select, US-AUTO, JP-AUTO, SG-AUTO

# Generic international traffic prefers HK but survives a regional outage.
PROXY-AUTO = fallback, HK-AUTO, SG-AUTO, JP-AUTO, US-AUTO, interval=300, timeout=5, evaluate-before-use=true
PROXY = select, PROXY-AUTO, HK, US, JP, SG, DIRECT
WIFI = select, PROXY, DIRECT

# Securities are the deliberate exception to region-isolated automatic groups.
# Smart uses real first-byte failures and per-site memory, so Tiger, Futu and
# Longbridge can each learn a different working node. HK is preferred, while
# every US/HK/JP/SG proxy remains available for automatic retry.
SECURITIES-AUTO = smart, include-all-proxies=true, policy-regex-filter="(?i)(\bUS\b|\bHK\b|\bJP\b|\bSG\b|USA|United\s*States|Hong\s*Kong|Japan|Singapore|美国|美國|香港|日本|新加坡|🇺🇸|🇭🇰|🇯🇵|🇸🇬|洛杉矶|洛杉磯|圣何塞|聖何塞|西雅图|西雅圖|达拉斯|達拉斯|纽约|紐約|东京|東京|大阪|埼玉|樱花|櫻花|狮城|獅城|HKBN|biglobe|c87s[1-4]\b|US\d+|HK\d+|JP\d+|SG\d+)", policy-priority="(?i)(\bHK\b|Hong\s*Kong|香港|🇭🇰|HKBN|HK\d+):0.75;(?i)(\bJP\b|Japan|日本|🇯🇵|东京|東京|大阪|埼玉|樱花|櫻花|biglobe|c87s4\b|JP\d+):0.95;(?i)(\bSG\b|Singapore|新加坡|狮城|獅城|🇸🇬|SG\d+):1.0;(?i)(\bUS\b|USA|United\s*States|美国|美國|🇺🇸|洛杉矶|洛杉磯|圣何塞|聖何塞|西雅图|西雅圖|达拉斯|達拉斯|纽约|紐約|c87s[123]\b|US\d+):1.1", evaluate-before-use=true
SECURITIES = select, SECURITIES-AUTO, HK, JP, SG, US, DIRECT

[Script]
network-region-changed = type=event, event-name=network-changed, script-path=https://raw.githubusercontent.com/arronnrock/clash-rules/main/surge/scripts/network-region.js, script-update-interval=86400, timeout=8, engine=jsc
network-region-started = type=event, event-name=engine-started, script-path=https://raw.githubusercontent.com/arronnrock/clash-rules/main/surge/scripts/network-region.js, script-update-interval=86400, timeout=8, engine=jsc

[Rule]
# Local/corporate traffic must never depend on a proxy or public DNS.
RULE-SET,LAN,DIRECT,no-resolve
RULE-SET,https://raw.githubusercontent.com/arronnrock/clash-rules/main/surge/rules/lan-corporate-direct.list,DIRECT,no-resolve,extended-matching

# These critical rules precede every network catch-all. Inline entries protect
# authentication/payment traffic even if a remote rule-set update is delayed.
DOMAIN-SUFFIX,chatgpt.com,AI-REGION,extended-matching
DOMAIN-SUFFIX,openai.com,AI-REGION,extended-matching
RULE-SET,https://raw.githubusercontent.com/arronnrock/clash-rules/main/surge/rules/ai-stable.list,AI-REGION,no-resolve,extended-matching
DOMAIN-SUFFIX,paypal.com,US-AUTO,extended-matching
DOMAIN-SUFFIX,paypalobjects.com,US-AUTO,extended-matching
DOMAIN-SUFFIX,braintreegateway.com,US-AUTO,extended-matching
RULE-SET,https://raw.githubusercontent.com/arronnrock/clash-rules/main/surge/rules/paypal-us.list,US-AUTO,no-resolve,extended-matching

# iOS cellular default: direct. Critical AI/PayPal rules above retain priority.
SUBNET,TYPE:CELLULAR,DIRECT

# iOS CMHK cellular is caught above and stays DIRECT. On Wi-Fi, all three
# broker families use a dedicated multi-node policy; DIRECT remains an explicit
# manual choice for overseas networks. Mac process rules catch rotating hosts.
PROCESS-NAME,Tiger Trade,SECURITIES #!MACOS-ONLY
PROCESS-NAME,longbridge,SECURITIES #!MACOS-ONLY
PROCESS-NAME,Futubull,SECURITIES #!MACOS-ONLY
PROCESS-NAME,moomoo,SECURITIES #!MACOS-ONLY
# Inline Tiger endpoints avoid stale remote-rule caches.
DOMAIN-SUFFIX,iotaskyt.com,SECURITIES,extended-matching
DOMAIN-SUFFIX,tigerfintech.com,SECURITIES,extended-matching
DOMAIN-SUFFIX,skytigris.cn,SECURITIES,extended-matching
RULE-SET,https://raw.githubusercontent.com/arronnrock/clash-rules/main/surge/rules/securities-wifi.list,SECURITIES,no-resolve,extended-matching

# Historical direct and compatibility fixes.
RULE-SET,https://raw.githubusercontent.com/arronnrock/clash-rules/main/surge/rules/wechat-direct-v2.list,DIRECT,no-resolve,extended-matching
RULE-SET,https://raw.githubusercontent.com/arronnrock/clash-rules/main/surge/rules/compat-direct.list,DIRECT,no-resolve,extended-matching
RULE-SET,https://raw.githubusercontent.com/arronnrock/clash-rules/main/surge/rules/china-direct-v2.list,DIRECT,no-resolve,extended-matching
GEOIP,CN,DIRECT

# Ordinary international services remain rule categories; only securities use
# a dedicated group because their live TLS reachability differs by node.
RULE-SET,https://raw.githubusercontent.com/arronnrock/clash-rules/main/surge/rules/international-wifi.list,WIFI,no-resolve,extended-matching

# All remaining Wi-Fi/Mac traffic follows the script-controlled WIFI group.
FINAL,WIFI,dns-failed
