[General]
dns-server = system

[Host]
xiaohongshu.com = server:223.5.5.5
*.xiaohongshu.com = server:223.5.5.5
xhscdn.com = server:223.5.5.5
*.xhscdn.com = server:223.5.5.5
xhslink.com = server:223.5.5.5
*.xhslink.com = server:223.5.5.5

[Proxy]
# Proxy policies are injected by the private Sub-Store Surge output.

[Proxy Group]
US = select, include-all-proxies=true, policy-regex-filter="(?i)(\bUS\b|USA|United\s*States|美国|🇺🇸|洛杉矶|圣何塞|西雅图|达拉斯|纽约|c87s1\b|c87s2\b|c87s3\b|US\d+)"
HK = select, include-all-proxies=true, policy-regex-filter="(?i)(\bHK\b|Hong\s*Kong|香港|🇭🇰|HK\d+)"
JP = select, include-all-proxies=true, policy-regex-filter="(?i)(\bJP\b|Japan|日本|🇯🇵|东京|大阪|埼玉|樱花|c87s4\b|JP\d+)"
SG = select, include-all-proxies=true, policy-regex-filter="(?i)(\bSG\b|Singapore|新加坡|🇸🇬|SG\d+)"
TW = select, include-all-proxies=true, policy-regex-filter="(?i)(\bTW\b|Taiwan|台湾|台北|🇹🇼|TW\d+)"
OTHER = select, include-all-proxies=true, policy-regex-filter="(?i)(英国|United\s*Kingdom|\bUK\b|🇬🇧|加拿大|Canada|🇨🇦|韩国|Korea|🇰🇷|泰国|Thailand|🇹🇭|越南|Vietnam|🇻🇳|尼日利亚|Nigeria|🇳🇬|印度|India|🇮🇳|马来西亚|Malaysia|🇲🇾|菲律宾|Philippines|🇵🇭|澳大利亚|Australia|🇦🇺|德国|Germany|🇩🇪|法国|France|🇫🇷)"
GLOBAL-PROXY = select, HK, JP, SG, TW, US, OTHER

[Rule]
RULE-SET,LAN,DIRECT
RULE-SET,https://raw.githubusercontent.com/arronnrock/clash-rules/main/surge/rules/openai.list,US,no-resolve,extended-matching
RULE-SET,https://raw.githubusercontent.com/arronnrock/clash-rules/main/surge/rules/paypal.list,US,no-resolve,extended-matching
SUBNET,TYPE:CELLULAR,DIRECT
RULE-SET,https://raw.githubusercontent.com/arronnrock/clash-rules/main/surge/rules/wechat-direct.list,DIRECT,no-resolve,extended-matching
RULE-SET,https://raw.githubusercontent.com/arronnrock/clash-rules/main/surge/rules/china-direct.list,DIRECT,no-resolve,extended-matching
GEOIP,CN,DIRECT
RULE-SET,https://raw.githubusercontent.com/arronnrock/clash-rules/main/surge/rules/foreign-proxy.list,GLOBAL-PROXY,no-resolve,extended-matching
FINAL,DIRECT
